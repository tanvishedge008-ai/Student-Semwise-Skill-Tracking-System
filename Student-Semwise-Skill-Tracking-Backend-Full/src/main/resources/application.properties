spring.application.name=student-semwise-skill-tracking-backend
server.port=8080

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/student_tracker
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}

# Development setting: Hibernate creates/updates tables from the entities.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Helpful for local development
spring.jackson.serialization.write-dates-as-timestamps=false
