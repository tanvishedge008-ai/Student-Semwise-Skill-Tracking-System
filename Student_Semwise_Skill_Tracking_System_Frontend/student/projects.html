<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Projects | Student Skill Tracking System</title>
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="../css/dashboard.css" />
  </head>
  <body class="app-page">
    <aside class="sidebar" id="sidebar">
      <div class="brand">SST System</div>
      <a class="side-link" href="dashboard.html">Dashboard</a
      ><a class="side-link" href="profile.html">My Profile</a
      ><a class="side-link" href="skills.html">My Skills</a
      ><a class="side-link" href="semester-history.html">Semester History</a
      ><a class="side-link" href="skill-assessment.html">Skill Assessment</a
      ><a class="side-link" href="projects.html">Projects</a
      ><a class="side-link" href="skill-gap.html">Skill Gap</a
      ><a class="side-link" href="learning-roadmap.html">Learning Roadmap</a
      ><a class="side-link" href="skill-progress.html">Skill Progress</a
      ><a class="side-link" href="resume.html">Resume</a
      ><a class="side-link" href="javascript:logout()">↪ Logout</a>
    </aside>
    <main class="main">
      <header class="topbar">
        <button class="mobile" id="menu">☰</button
        ><input
          id="globalSearch"
          class="form-control search"
          placeholder="Search..."
        />
        <div class="profile-mini">
          <span data-name>Tanvi</span><span class="avatar" data-avatar>T</span>
        </div>
      </header>
      <section class="page">
        <div class="page-head">
          <div>
            <h1>Projects</h1>
            <p class="muted">Record projects and faculty verification.</p>
          </div>
          <button class="btn" onclick="openModal('projectModal')">
            + Add Project
          </button>
        </div>
        <div class="table-wrap">
          <table class="table">
            <thead>
              <tr>
                <th>Project</th>
                <th>Technologies</th>
                <th>Semester</th>
                <th>Status</th>
                <th>Verification</th>
              </tr>
            </thead>
            <tbody id="projectRows"></tbody>
          </table>
        </div>
        <div class="modal" id="projectModal">
          <div class="modal-box">
            <div class="modal-head">
              <h2>Add Project</h2>
              <button class="close" onclick="closeModal('projectModal')">
                ×
              </button>
            </div>
            <form onsubmit="addProject(event)">
              <div class="form-group">
                <label>Project Title</label
                ><input class="form-control" id="projectTitle" required />
              </div>
              <div class="form-group">
                <label>Description</label
                ><textarea
                  class="form-control"
                  id="projectDescription"
                  required
                ></textarea>
              </div>
              <div class="form-group">
                <label>Technologies</label
                ><input class="form-control" id="projectTech" required />
              </div>
              <div class="form-group">
                <label>Semester</label
                ><select class="form-control" id="projectSemester">
                  <option>1</option>
                  <option>2</option>
                  <option>3</option>
                  <option>4</option>
                  <option>5</option>
                  <option>6</option>
                  <option>7</option>
                  <option>8</option>
                </select>
              </div>
              <div class="form-group">
                <label>GitHub URL</label
                ><input class="form-control" id="projectGithub" type="url" />
              </div>
              <button class="btn">Add Project</button>
            </form>
          </div>
        </div>
      </section>
    </main>
    <div class="toast" id="toast"></div>
    <script src="../js/main.js"></script>
  </body>
</html>
