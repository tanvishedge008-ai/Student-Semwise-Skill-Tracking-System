<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Learning-Resources | Student Skill Tracking System</title>
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="../css/dashboard.css" />
  </head>
  <body class="app-page">
    <aside class="sidebar" id="sidebar">
      <div class="brand">SST System</div>
      <a class="side-link" href="dashboard.html">Dashboard</a
      ><a class="side-link" href="users.html">Users</a
      ><a class="side-link" href="departments.html">Departments</a
      ><a class="side-link" href="semesters.html">Semesters</a
      ><a class="side-link" href="skills.html">Skills</a
      ><a class="side-link" href="career-profiles.html">Career Profiles</a
      ><a class="side-link" href="learning-resources.html">Learning Resources</a
      ><a class="side-link" href="system-analytics.html">System Analytics</a
      ><a class="side-link" href="javascript:logout()">↪ Logout</a>
    </aside>
    <main class="main">
      <header class="topbar">
        <button class="mobile" id="menu">☰</button
        ><input
          id="globalSearch"
          class="form-control search"
          placeholder="Search..."
        />
        <div class="profile-mini">
          <span data-name>Tanvi</span><span class="avatar" data-avatar>T</span>
        </div>
      </header>
      <section class="page">
        <div class="page-head">
          <div><h1>Learning Resources</h1></div>
          <button class="btn" onclick="toast('Resource added')">
            + Add Resource
          </button>
        </div>
        <div class="table-wrap">
          <table class="table">
            <thead>
              <tr>
                <th>Resource</th>
                <th>Skill</th>
                <th>Type</th>
                <th>Difficulty</th>
                <th>URL</th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <td>Spring Boot Documentation</td>
                <td>Spring Boot</td>
                <td>Documentation</td>
                <td>Intermediate</td>
                <td>
                  <a
                    class="btn"
                    href="https://spring.io/projects/spring-boot"
                    target="_blank"
                    >Open</a
                  >
                </td>
              </tr>
              <tr>
                <td>JavaScript Guide</td>
                <td>JavaScript</td>
                <td>Documentation</td>
                <td>Beginner</td>
                <td>
                  <a
                    class="btn"
                    href="https://developer.mozilla.org/en-US/docs/Web/JavaScript"
                    target="_blank"
                    >Open</a
                  >
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </section>
    </main>
    <div class="toast" id="toast"></div>
    <script src="../js/main.js"></script>
  </body>
</html>
