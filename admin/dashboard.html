<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Dashboard | Student Skill Tracking System</title>
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="../css/dashboard.css" />
  </head>
  <body class="app-page">
    <aside class="sidebar" id="sidebar">
      <div class="brand">SST System</div>
      <a class="side-link" href="dashboard.html">Dashboard</a
      ><a class="side-link" href="users.html">Users</a
      ><a class="side-link" href="departments.html">Departments</a
      ><a class="side-link" href="semesters.html">Semesters</a
      ><a class="side-link" href="skills.html">Skills</a
      ><a class="side-link" href="career-profiles.html">Career Profiles</a
      ><a class="side-link" href="learning-resources.html">Learning Resources</a
      ><a class="side-link" href="system-analytics.html">System Analytics</a
      ><a class="side-link" href="javascript:logout()">↪ Logout</a>
    </aside>
    <main class="main">
      <header class="topbar">
        <button class="mobile" id="menu">☰</button
        ><input
          id="globalSearch"
          class="form-control search"
          placeholder="Search..."
        />
        <div class="profile-mini">
          <span data-name></span><span class="avatar" data-avatar></span>
        </div>
      </header>
      <section class="page">
        <div class="page-head">
          <div>
            <h1>Admin Dashboard</h1>
            <p class="muted">Manage system data and configuration.</p>
          </div>
        </div>
        <div class="stats">
          <div class="stat">
            <div class="label">Total Users</div>
            <div class="value">156</div>
          </div>
          <div class="stat">
            <div class="label">Students</div>
            <div class="value">128</div>
          </div>
          <div class="stat">
            <div class="label">Faculty</div>
            <div class="value">24</div>
          </div>
          <div class="stat">
            <div class="label">Departments</div>
            <div class="value">5</div>
          </div>
        </div>
        <div class="grid grid3">
          <div class="card">
            <h3>Skills</h3>
            <div class="value">86</div>
          </div>
          <div class="card">
            <h3>Career Profiles</h3>
            <div class="value">12</div>
          </div>
          <div class="card">
            <h3>System Status</h3>
            <span class="badge success">Operational</span>
          </div>
        </div>
      </section>
    </main>
    <div class="toast" id="toast"></div>
    <script src="../js/api.js"></script>
<script src="../js/main.js"></script>
<script src="../js/admin.js"></script>
  </body>
</html>
