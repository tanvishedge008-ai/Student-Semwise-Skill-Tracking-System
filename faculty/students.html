<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Students | Student Skill Tracking System</title>

    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="../css/dashboard.css" />
  </head>

  <body class="app-page">

    <aside class="sidebar" id="sidebar">
      <div class="brand">SST System</div>

      <a class="side-link" href="dashboard.html">Dashboard</a>
      <a class="side-link" href="students.html">Students</a>
      <a class="side-link" href="semesters.html">Semesters</a>
      <a class="side-link" href="analytics.html">Analytics</a>
      <a class="side-link" href="skill-assessments.html">
        Skill Assessments
      </a>
      <a class="side-link" href="evidence-verification.html">
        Evidence Verification
      </a>
      <a class="side-link" href="reports.html">Reports</a>
      <a class="side-link" href="javascript:logout()">↪ Logout</a>
    </aside>

    <main class="main">

      <header class="topbar">

        <button class="mobile" id="menu">☰</button>

        <input
          id="globalSearch"
          class="form-control search"
          placeholder="Search..."
        />

        <div class="profile-mini">
          <span data-name></span>
          <span class="avatar" data-avatar></span>
        </div>

      </header>

      <section class="page">

        <div class="page-head">
          <div>
            <h1>Students</h1>
            <p class="muted">
              Search and filter student records.
            </p>
          </div>
        </div>

        <div class="toolbar">

          <input
            class="form-control"
            placeholder="Search students..."
            oninput="filterRows(this.value)"
          />

          <select class="form-control" id="departmentFilter">
            <option value="">All Departments</option>
            <option value="Information Technology">
              Information Technology
            </option>
            <option value="Computer Engineering">
              Computer Engineering
            </option>
          </select>

          <select class="form-control" id="semesterFilter">
            <option value="">All Semesters</option>
            <option value="1">Semester 1</option>
            <option value="2">Semester 2</option>
            <option value="3">Semester 3</option>
            <option value="4">Semester 4</option>
            <option value="5">Semester 5</option>
            <option value="6">Semester 6</option>
            <option value="7">Semester 7</option>
            <option value="8">Semester 8</option>
          </select>

        </div>

        <div class="table-wrap">

          <table class="table">

            <thead>
              <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Department</th>
                <th>Semester</th>
                <th>Skills</th>
                <th>Progress</th>
                <th>Status</th>
                <th>Action</th>
              </tr>
            </thead>

            <tbody id="facultyStudentsBody">

              <tr>
                <td colspan="8">
                  Loading students...
                </td>
              </tr>

            </tbody>

          </table>

        </div>

      </section>

    </main>

    <div class="toast" id="toast"></div>

    <script src="../js/api.js"></script>
    <script src="../js/main.js"></script>
    <script src="../js/faculty.js"></script>

  </body>
</html>
