<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Login</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="auth">
      <div class="auth-card">
        <div class="logo">◆ SST System</div>
        <h1>Welcome Back</h1>
        <p class="muted">
          Demo frontend login — real authentication will be added through Spring
          Boot.
        </p>
        <form onsubmit="loginDemo(event)">
          <div class="form-group">
            <label>Username / Email</label
            ><input class="form-control" id="username" required />
          </div>
          <div class="form-group">
            <label>Password</label
            ><input
              class="form-control"
              id="password"
              type="password"
              required
            />
          </div>
          <div class="form-group">
            <label>Role</label
            ><select class="form-control" id="role">
              <option>Student</option>
              <option>Faculty</option>
              <option>Admin</option>
            </select>
          </div>
          <div id="loginError" class="error"></div>
          <div class="auth-actions">
            <button class="btn btn-primary">Login</button
            ><a class="btn btn-outline" href="register.html">Create Account</a>
          </div>
        </form>
        <p style="margin-top: 18px">
          <a href="#" onclick="forgotPassword(); return false;">
    Forgot Password
</a>
        </p>
      </div>
    </div>
    <script src="js/api.js"></script>
<script src="js/auth.js"></script>
  </body>
</html>
